name: Deploy OrdersCutella Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orderscutella-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to shared Vesta VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: BOTTOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            APP_DIR=/opt/orderscutella
            REPO=https://github.com/hsdarestani/orderscutella.git
            DOMAIN=orderscutella.smarbiz.sbs
            PORT=8095
            RELAY=https://cutella-bridge-relay.hsdf7rb.workers.dev

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y docker-compose-plugin
            fi

            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" reset --hard origin/main
            fi

            mkdir -p "$APP_DIR/data"
            chmod 700 "$APP_DIR/data"
            cat > "$APP_DIR/.env" <<EOF
            BOTTOKEN=$BOTTOKEN
            EOF
            chmod 600 "$APP_DIR/.env"

            cd "$APP_DIR"
            docker compose -p orderscutella up -d --build --remove-orphans

            sleep 3
            curl -fsS "http://127.0.0.1:${PORT}/health"
            curl -fsS "http://127.0.0.1:${PORT}/vestaland-order-sync/health"

            echo "Cloudflare relay connectivity"
            curl -sS --connect-timeout 8 --max-time 15 \
              -o /dev/null \
              -w 'relay code=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
              "$RELAY/" || true

            echo "Cutella signed Bridge paid-order probe (must fail before creating an order)"
            docker compose -p orderscutella exec -T bot python - <<'PY'
            from app.integrations import WooClient
            try:
                WooClient()._signed_get('create_paid_order', {})
            except Exception as exc:
                text = str(exc)
                print('paid-order-probe=', text)
                if 'Unknown operation' in text or 'unknown operation' in text.lower():
                    raise SystemExit('LIVE_CUTELLA_WORDPRESS_BRIDGE_IS_OLD')
                if 'Invalid Vestaland receipt' not in text:
                    raise SystemExit('UNEXPECTED_PAID_ORDER_PROBE_RESPONSE: ' + text)
            else:
                raise SystemExit('PAID_ORDER_PROBE_UNEXPECTEDLY_SUCCEEDED')
            print('Cutella WordPress paid-order operation is installed.')
            PY

            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y nginx
            fi

            cat > "/etc/nginx/sites-available/$DOMAIN" <<EOF
            server {
                listen 80;
                server_name $DOMAIN;

                location / {
                    proxy_pass http://127.0.0.1:${PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 180s;
                }
            }
            EOF

            ln -sf "/etc/nginx/sites-available/$DOMAIN" "/etc/nginx/sites-enabled/$DOMAIN"
            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if getent ahostsv4 "$DOMAIN" >/dev/null 2>&1; then
              if ! command -v certbot >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y certbot python3-certbot-nginx
              fi
              certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            fi

            docker compose -p orderscutella ps
            docker compose -p orderscutella logs --tail=50 bot
